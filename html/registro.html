<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro de usuario</title>
  <!-- CSS específico para registro -->
  <link rel="stylesheet" href="../css/registro.css">
</head>
<body>
  <header>
    <h1>TicketPerú</h1>
    <p><em>Registro de usuario</em></p>
    <nav>
      <!-- Encabezado dinámico con accesos rápidos -->
      <a href="../index.html">Inicio</a>
      <a href="../html/catalogo.html">Catálogo</a>
      <a href="../html/pago.html">Pago</a>
      <a href="../html/reventa.html">Reventa</a>
    </nav>
  </header>

  <main>
    <h2>Crea tu cuenta</h2>
    <form>
      <label>Nombre completo: <input type="text" required></label><br>
      <label>Email: <input type="email" required></label><br>
      <label>Contraseña: <input type="password" required></label><br>
      <label>Preferencias:
        <select>
          <option>Conciertos</option>
          <option>Teatro</option>
          <option>Deportes</option>
        </select>
      </label><br>
      <button type="submit">Registrarme</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2026 TicketPerú</p>
  </footer>
</body>
</html>
